version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod # Menggunakan Dockerfile production
    container_name: kopibang_app_prod
    ports:
      - "127.0.0.1:8080:8080" # Dikunci ke localhost
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kopibang_network
    restart: always

  mysql:
    image: mysql:8.0
    container_name: kopibang_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: kopibang_coffee
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecretpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kopibang_network

  redis:
    image: redis:7-alpine
    container_name: kopibang_redis_prod
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - kopibang_network

  minio:
    image: minio/minio:latest
    container_name: kopibang_minio_prod
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: kopibang
      MINIO_ROOT_PASSWORD: kopibang
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    networks:
      - kopibang_network

volumes:
  mysql_data_prod:
  redis_data_prod:
  minio_data_prod:

networks:
  kopibang_network:
    driver: bridge