version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: kopibang_app_prod
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./.env:/app/.env
      - ./firebase-service-account.json:/app/firebase-service-account.json
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kopibang_network
    restart: always

  mysql:
    image: mysql:8.0
    container_name: kopibang_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: kopibang
      MYSQL_DATABASE: kopibang
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pkopibang"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kopibang_network

  redis:
    image: redis:7-alpine
    container_name: kopibang_redis_prod
    restart: always
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - kopibang_network

  minio:
    image: minio/minio:latest
    container_name: kopibang_minio_prod
    restart: always
    ports:
      - "9005:9000"           # <--- UBAH BARIS INI (Hapus 127.0.0.1:)
      - "127.0.0.1:9006:9001" # Ini port GUI, biarkan saja
    environment:
      MINIO_ROOT_USER: kopibang
      MINIO_ROOT_PASSWORD: kopibang
    volumes:
      - minio_data_prod:/data
    command: server /data --console-address ":9001"
    networks:
      - kopibang_network

  # --- GUI TAMBAHAN ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: kopibang_phpmyadmin_prod
    restart: always
    ports:
      - "127.0.0.1:8090:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: kopibang
    networks:
      - kopibang_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: kopibang_redis_commander_prod
    restart: always
    ports:
      - "127.0.0.1:8091:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - kopibang_network

volumes:
  mysql_data_prod:
  redis_data_prod:
  minio_data_prod:

networks:
  kopibang_network:
    driver: bridge