version: '3.8'

services:
  # --- Aplikasi Golang (API) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kopibang_app
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - kopibang_network

  # --- Database MySQL ---
  mysql:
    image: mysql:8.0
    container_name: kopibang_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: kopibang_coffee
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecretpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kopibang_network

  # --- Cache Redis ---
  redis:
    image: redis:7-alpine
    container_name: kopibang_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kopibang_network

  # --- Storage MinIO ---
  minio:
    image: minio/minio:latest
    container_name: kopibang_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: kopibang
      MINIO_ROOT_PASSWORD: kopibang
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - kopibang_network

  # --- GUI MySQL (phpMyAdmin) ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: kopibang_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: secretpassword
    ports:
      - "5050:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - kopibang_network

  # --- GUI Redis (Redis Commander) ---
  redis_commander:
    image: rediscommander/redis-commander:latest
    container_name: kopibang_redis_commander
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - kopibang_network

volumes:
  mysql_data:
  redis_data:
  minio_data:

networks:
  kopibang_network:
    driver: bridge